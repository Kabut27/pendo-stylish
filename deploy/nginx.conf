# deploy/nginx.conf
# Nakili faili hii kuwa: /etc/nginx/sites-available/pendostylish
# Kisha: sudo ln -s /etc/nginx/sites-available/pendostylish /etc/nginx/sites-enabled/
# Badilisha "pendostylish.co.tz" kuwa domain yako halisi kabla ya kuendesha Certbot.

server {
    listen 80;
    server_name pendostylish.co.tz;

    client_max_body_size 45M; # kuruhusu kupakia picha (12MB) na video fupi za bidhaa (40MB) + margin

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Picha zilizopakiwa - ruhusu browser kuzihifadhi (cache) kwa muda mrefu
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}

# Baada ya Certbot kuendeshwa (angalia setup-vps.sh), itaongeza kiotomatiki
# sehemu ya "listen 443 ssl;" na cheti cha HTTPS hapa juu.
